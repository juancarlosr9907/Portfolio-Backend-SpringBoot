<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="container">
            <div th:insert="fragments/nav :: nav" ></div><!--lo bueno es que se combinan 2 fragmentos, el original header con el personal info-->

            <div th:insert="sections/skills-section :: skills" ></div>
            <div th:insert="sections/experience-section :: experience" ></div>

        </div>
    </main>
    <div th:insert="fragments/footer :: footer"></div>
